name: local-runtime-adapter-demo
command: python examples/scripts/local_runtime_adapter_demo.py --runtime-name python-subprocess --model-path models/local-runtime-demo.onnx --input-shape 1,3,224,224 --warmup-runs 1 --repeat-runs 3 --include-resource-metrics -- python -c "print('runtime-demo-inference')"
model_name: local-runtime-demo-model
model_version: "1.0"
model_format: onnx
model_path: models/local-runtime-demo.onnx
task: image-classification
input_shape: [1, 3, 224, 224]
input_dtype: float32
runtime: python-subprocess
execution_provider: cpu
precision: fp32
batch_size: 1
warmup_runs: 1
repeat_runs: 3
include_preprocess: false
include_postprocess: false
timeout_seconds: 30
working_directory: .
