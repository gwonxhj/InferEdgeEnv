name: local-adapter-template
command: python examples/scripts/adapter_template.py --adapter-name copyable-local-adapter --include-resource-metrics --resource-source adapter-template -- python -c "print('adapter-template-runtime')"
model_name: adapter-template-model
model_version: "1.0"
model_format: onnx
model_path: models/adapter-template.onnx
task: image-classification
input_shape: [1, 3, 224, 224]
input_dtype: float32
runtime: user-owned-runtime
execution_provider: cpu
precision: fp32
batch_size: 1
warmup_runs: 1
repeat_runs: 3
include_preprocess: false
include_postprocess: false
timeout_seconds: 30
working_directory: .
