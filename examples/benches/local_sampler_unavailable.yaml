name: local-sampler-unavailable
command: python examples/scripts/run_with_sampler_failure_modes.py --mode sampler-unavailable -- python examples/scripts/emit_local_metrics.py
model_name: local-sampler-demo-model
model_version: "1.0"
model_format: onnx
model_path: models/local-sampler-demo.onnx
task: object-detection
input_shape: [1, 3, 224, 224]
input_dtype: float32
runtime: local-python
execution_provider: cpu
precision: fp32
batch_size: 1
warmup_runs: 1
repeat_runs: 3
include_preprocess: true
include_postprocess: true
timeout_seconds: 30
working_directory: .
extra_env:
  LOCAL_DEMO_FLAG: sampler-unavailable
